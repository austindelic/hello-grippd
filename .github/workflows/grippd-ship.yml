# generated by grippd 0.3.0 from grippd.yaml. Don't edit: change grippd.yaml and grippd regenerates this file.
# Every push to main is checked, built and handed to grippd for staging. Running this
# workflow by hand (Actions > Ship > Run workflow, or `gh workflow run grippd-ship.yml --ref
# <branch>`) does the same for that branch in dev, the sandbox that needs no approval.
# grippd's cloud does the rest, in order: infrastructure, migrations, deploys, health
# checks, and rollback if one fails. A v* tag promotes the build staging is running to
# production, byte for byte; grippd sees the tag itself, so nothing runs here for it.
#
# What this run may send is decided by grippd from the push's diff, not here: mint.sh
# returns the run's manifest, and grippd blocks anything it doesn't list.
name: Ship
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ship-${{ github.event_name == 'workflow_dispatch' && 'dev' || 'staging' }}
  cancel-in-progress: false
env:
  GRIPPD_PROJECT: hello-grippd
jobs:
  checks:
    uses: ./.github/workflows/grippd-checks.yml

  ship:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Mint this job's one-use key, bound to this commit and run (it can't deploy anything)
        run: .github/grippd/mint.sh ship
      - id: manifest
        name: What grippd expects from this run
        run: |
          has() { jq -e --arg n "$1" '.artifacts | any(.name == $n)' "$GRIPPD_MANIFEST" >/dev/null && echo true || echo false; }
          {
            echo "hello-grippd=$(has hello-grippd)"
            echo "ready=$(jq -r .ready "$GRIPPD_MANIFEST")"
          } >> "$GITHUB_OUTPUT"
      - name: Build and upload hello-grippd
        if: steps.manifest.outputs.hello-grippd == 'true'
        run: |
          .github/grippd/ship.sh artifact hello-grippd .
      - name: Hand this commit to grippd
        if: steps.manifest.outputs.ready == 'true'
        run: .github/grippd/ship.sh ready
